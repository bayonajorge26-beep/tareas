*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{background:#000}
button,input{font-family:inherit}
body{color:#fff;font-family:Poppins,-apple-system,sans-serif;padding:calc(env(safe-area-inset-top) + 12px) 20px 150px}
header{display:flex;justify-content:space-between;align-items:flex-end;margin:18px 0 6px}
h1{font-size:38px;font-weight:800;letter-spacing:-.5px}
.fecha{text-align:right;color:#888;font-size:15px;line-height:1}
.fecha b{display:block;color:#fff;font-size:32px;font-weight:800;margin-bottom:2px}
.resumen{color:#888;font-size:14px;margin-bottom:6px}
.resumen .r{color:#FF5252}
.cat{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:800;letter-spacing:1.2px;margin:24px 0 4px}
.cat .n{background:#1c1c1e;color:#aaa;border-radius:10px;padding:2px 8px;font-size:11px;letter-spacing:0}
.t{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid #151515;transition:opacity .4s,transform .4s}
.t.fuera{opacity:0;transform:translateX(40px)}
.c{position:relative;width:24px;height:24px;border:2px solid #fff;border-radius:50%;flex-shrink:0;transition:background .3s}
.t.hecha .c{background:#fff;border-color:#fff !important}
.t.hecha .c:after{content:"";position:absolute;left:7px;top:3px;width:5px;height:10px;border:solid #000;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.cuerpo{flex:1;min-width:0}
.tx{position:relative;display:inline-block;font-size:18px;font-weight:500;transition:color .5s}
.lapiz{position:absolute;left:-5px;top:50%;width:calc(100% + 10px);height:12px;transform:translateY(-40%);overflow:visible;pointer-events:none}
.lapiz path{fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset .6s cubic-bezier(.65,.05,.35,1)}
.t.hecha .lapiz path{stroke-dashoffset:0}
.t.hecha .tx{color:#666}
.t.fija .lapiz path,.t.fija .tx,.t.fija .c{transition:none}
.bell{font-size:13px;margin-left:6px}
.t.imp{background:linear-gradient(90deg,rgba(255,94,0,.16),rgba(255,94,0,0) 75%);margin:0 -10px;padding-left:10px;padding-right:10px;border-radius:14px;border-bottom-color:transparent}
.t.imp .tx{font-weight:700}
.t.imp.hecha{background:none}
.llama{display:inline-block;font-size:16px;margin-left:6px;transform-origin:50% 85%;animation:llama 1.1s ease-in-out infinite;filter:drop-shadow(0 0 5px rgba(255,110,0,.9))}
@keyframes llama{0%,100%{transform:scale(1) rotate(-4deg);filter:drop-shadow(0 0 4px rgba(255,110,0,.7))}25%{transform:scale(1.12,1.2) rotate(3deg)}50%{transform:scale(.95,1.05) rotate(-2deg);filter:drop-shadow(0 0 9px rgba(255,140,0,1))}75%{transform:scale(1.1,1.15) rotate(4deg)}}
.t.hecha .llama{animation:none;opacity:.3;filter:none}
.sw.fuego.on{background:linear-gradient(90deg,#FF3D00,#FFB300)}
.sub{font-size:12px;color:#777;margin-top:3px}
.sub.venc{color:#FF5252}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
.vacio{color:#3a3a3a;font-size:14px;padding:10px 0}
.semnav{display:flex;justify-content:space-between;align-items:center;margin:14px 0 4px}
.semnav button{background:#1c1c1e;border:none;color:#fff;width:40px;height:40px;border-radius:50%;font-size:20px}
.semnav span{font-weight:700;font-size:16px}
.dia{margin-top:18px}
.dcab{display:flex;justify-content:space-between;align-items:center;color:#888;font-size:14px;font-weight:700;padding-bottom:4px;border-bottom:1px solid #222}
.dia.hoy .dcab{color:#fff}
.dia.hoy .dcab b{background:#fff;color:#000;border-radius:8px;padding:1px 7px;margin-left:6px;font-size:11px}
.mas{background:none;border:none;color:#888;font-size:24px;width:34px;height:30px}
.fab{position:fixed;right:22px;bottom:calc(env(safe-area-inset-bottom) + 100px);width:62px;height:62px;border-radius:50%;background:#fff;color:#000;font-size:34px;font-weight:300;border:none;box-shadow:0 6px 24px rgba(255,255,255,.12)}
nav{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 20px);height:62px;background:rgba(28,28,30,.92);-webkit-backdrop-filter:blur(20px);border-radius:31px;display:flex;padding:6px}
nav button{flex:1;background:none;border:none;color:#777;font-size:13px;font-weight:700;border-radius:25px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button i{font-style:normal;font-size:18px}
nav button.on{color:#fff;background:#2c2c2e}
.capa{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-end;z-index:10}
.capa.on{display:flex}
.hoja{background:#1c1c1e;width:100%;border-radius:26px 26px 0 0;padding:22px 20px calc(env(safe-area-inset-bottom) + 24px);animation:sube .25s ease}
@keyframes sube{from{transform:translateY(100%)}to{transform:none}}
.hoja h2{font-size:20px;margin-bottom:16px}
.lbl{color:#888;font-size:12px;font-weight:700;letter-spacing:1px;margin:4px 0 8px}
input[type=text],input[type=date]{width:100%;background:#2c2c2e;border:none;border-radius:12px;color:#fff;font-size:17px;padding:14px;margin-bottom:14px;-webkit-user-select:text;user-select:text;-webkit-appearance:none;font-family:inherit}
input[type=date]{min-height:50px}
input.error{outline:2px solid #FF5252}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{padding:9px 14px;border-radius:20px;background:#2c2c2e;font-size:14px;font-weight:600;color:#ccc;border:2px solid transparent}
.chip.on{background:#fff;color:#000}
.chip.cat.on{background:transparent;color:#fff}
.fila{display:flex;justify-content:space-between;align-items:center;margin:4px 0 14px;font-size:16px;font-weight:600}
.sw{width:52px;height:32px;border-radius:16px;background:#3a3a3c;position:relative;transition:background .25s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .25s}
.sw.on{background:#34C759}
.sw.on:after{transform:translateX(20px)}
.oculto{display:none !important}
.ok{width:100%;padding:16px;border:none;border-radius:14px;background:#fff;color:#000;font-size:17px;font-weight:800;margin-top:6px}
.cancelar{width:100%;padding:14px;border:none;border-radius:14px;background:#2c2c2e;color:#fff;font-size:16px;font-weight:600;margin-top:10px}
.borrar{background:#FF5252;color:#fff}
.pista{color:#444;font-size:12px;text-align:center;margin-top:30px}

/* ---------- Ordenador ---------- */
#estadoNube{position:fixed;top:18px;right:64px;font-size:12px;font-weight:600;color:#666;z-index:5}
#estadoNube.n-ok{color:#4caf50}#estadoNube.n-err{color:#FF9F43}#estadoNube.n-sync{color:#888}
#btAjustes{position:fixed;top:10px;right:16px;width:36px;height:36px;border-radius:50%;border:none;background:#1c1c1e;color:#aaa;font-size:18px;cursor:pointer;z-index:5}
.expl{color:#999;font-size:14px;line-height:1.5;margin:-6px 0 16px}
button,.chip,.t,.sw{cursor:pointer}
.t:hover .tx{color:#ddd}
.t.hecha:hover .tx{color:#666}
nav button:hover{color:#ccc}
.capa{justify-content:center}
.hoja{max-width:560px}
@media (min-width:900px){
  body{max-width:1240px;margin:0 auto;padding:36px 48px 150px}
  header{margin-top:24px}
  h1{font-size:52px}
  .fecha b{font-size:40px}
  .tx{font-size:17px}
  #main:has(> section.grupo){display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:start}
  #main:has(> section.grupo) > .resumen,#main:has(> section.grupo) > .pista{grid-column:1/-1}
  .grupo{background:#0b0b0b;border:1px solid #1c1c1c;border-radius:22px;padding:4px 20px 12px;min-height:180px}
  .grupo .cat{margin-top:16px}
  .t.imp{margin:0 -12px;padding-left:12px;padding-right:12px}
  .dia .t.imp{margin:0 -6px;padding-left:6px;padding-right:6px}
  #main:has(> .dia){display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px;align-items:start}
  #main:has(> .dia) > .semnav{grid-column:1/-1;max-width:420px;margin:10px auto 6px;width:100%}

<script>const GIST_DESC = "Tareas Jorge (app)"
const GIST_FILE = "tareas.json"
function normalizar(e) {
  if (Array.isArray(e)) e = { tareas: e, borradas: {} }
  e = e || {}
  e.tareas = Array.isArray(e.tareas) ? e.tareas : []
  e.borradas = e.borradas || {}
  for (const x of e.tareas) {
    if (!x.creada) x.creada = Number(x.id) || Date.now()
    if (!x.avisos) x.avisos = []
    if (!x.mod) x.mod = x.creada
  }
  return e
}
function sinMod(x) { const c = Object.assign({}, x); delete c.mod; return JSON.stringify(c) }
function marcarCambios(prev, nuevo, borradas) {
  const ahora = Date.now()
  const mp = new Map(prev.map(t => [t.id, t]))
  for (const t of nuevo) {
    const a = mp.get(t.id)
    if (!a || sinMod(a) !== sinMod(t)) t.mod = ahora
    else t.mod = a.mod || t.mod || ahora
    mp.delete(t.id)
  }
  for (const id of mp.keys()) borradas[id] = ahora
}
function fusionar(a, b) {
  a = normalizar(a); b = normalizar(b)
  const borr = Object.assign({}, a.borradas)
  for (const k in b.borradas) borr[k] = Math.max(borr[k] || 0, b.borradas[k])
  const m = new Map()
  for (const t of a.tareas.concat(b.tareas)) {
    const x = m.get(t.id)
    if (!x || (t.mod || 0) > (x.mod || 0)) m.set(t.id, t)
  }
  const limite = Date.now() - 90 * 86400000
  for (const k in borr) if (borr[k] < limite) delete borr[k]
  return { tareas: [...m.values()].filter(t => !(borr[t.id] >= (t.mod || 0))), borradas: borr }
}
